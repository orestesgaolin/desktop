name: gpu_playground
description: "A Flutter GPU playground: a desktop gallery of shader and GPU rendering demos."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0-147.0.dev

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_deck: ^0.29.0
  flutter_gpu:
    sdk: flutter
  flutter_scene: ^0.22.2
  flutter_svg: ^2.3.0
  marionette_flutter: ^0.6.0
  mermaid_core:
    path: ../mermaid/packages/mermaid_core
  mermaid_flutter:
    path: ../mermaid/packages/mermaid_flutter
  qr: ^4.0.0
  syntax_highlight: ^0.5.0
  vector_math: ^2.4.2
  video_player: ^2.14.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hooks: ^2.2.0

dependency_overrides:
  mermaid_core:
    path: ../mermaid/packages/mermaid_core

flutter:
  uses-material-design: true
  assets:
    - shaders/
    - assets/images/
    - assets/flocker-video.mp4
    - assets/flutter_visible_macos.mp4
    - flutter_scene_generated/
